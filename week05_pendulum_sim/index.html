<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>单摆模拟器 - Week05</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a24;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    color: #8888aa;
  }
  canvas {
    display: block;
    border-radius: 12px;
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 28px;
    margin-top: 18px;
    padding: 14px 28px;
    background: rgba(30, 30, 46, 0.85);
    border: 1px solid rgba(126, 184, 218, 0.12);
    border-radius: 10px;
  }
  .control-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .control-group label {
    font-size: 11px;
    letter-spacing: 1px;
    opacity: 0.6;
    text-transform: uppercase;
  }
  .control-group .value {
    font-size: 14px;
    color: #7eb8da;
    font-variant-numeric: tabular-nums;
    min-width: 52px;
    text-align: center;
  }
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 120px;
    height: 4px;
    background: rgba(126, 184, 218, 0.15);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #5ba8d4;
    box-shadow: 0 0 6px rgba(91, 168, 212, 0.5);
    cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #5ba8d4;
    box-shadow: 0 0 6px rgba(91, 168, 212, 0.5);
    border: none;
    cursor: pointer;
  }
  .btn-reset {
    padding: 8px 20px;
    background: rgba(91, 168, 212, 0.15);
    border: 1px solid rgba(91, 168, 212, 0.3);
    border-radius: 6px;
    color: #7eb8da;
    font-size: 13px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
  }
  .btn-reset:hover {
    background: rgba(91, 168, 212, 0.25);
    border-color: rgba(91, 168, 212, 0.5);
  }
  .info {
    position: fixed;
    bottom: 24px;
    font-size: 13px;
    letter-spacing: 1px;
    opacity: 0.5;
  }
  .params {
    position: fixed;
    top: 24px;
    right: 32px;
    font-size: 13px;
    line-height: 1.8;
    text-align: right;
    opacity: 0.6;
  }
  .params span { color: #7eb8da; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="controls">
  <div class="control-group">
    <label>摆长 L (px)</label>
    <input type="range" id="sliderL" min="100" max="350" value="200" step="1">
    <span class="value" id="valL">200</span>
  </div>
  <div class="control-group">
    <label>重力 g</label>
    <input type="range" id="sliderG" min="1" max="25" value="9.8" step="0.1">
    <span class="value" id="valG">9.8</span>
  </div>
  <div class="control-group">
    <label>阻尼</label>
    <input type="range" id="sliderD" min="0" max="0.010" value="0.001" step="0.001">
    <span class="value" id="valD">0.001</span>
  </div>
  <button class="btn-reset" id="btnReset">重置摆动</button>
</div>
<div class="params">
  摆长 L = <span>200 px</span><br>
  重力 g = <span>9.8 m/s²</span><br>
  初始摆角 = <span>45°</span>
</div>
<div class="info">单摆简谐振动模拟器 — 余玉玲 7903126031</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const W = canvas.width = Math.min(window.innerWidth * 0.85, 800);
const H = canvas.height = Math.min(window.innerHeight * 0.78, 600);

const PIVOT_X = W / 2;
const PIVOT_Y = H * 0.15;
let L = 200;
let G = 9.8;
const SCALE = 0.01;
let dampingFactor = 0.001;
const BOB_RADIUS = 18;

let angle = (45 * Math.PI) / 180;
let angularVelocity = 0;
let lastTime = null;

let trail = [];
const MAX_TRAIL = 60;

function updatePhysics(dt) {
  const angularAcceleration = (-G / (L * SCALE)) * Math.sin(angle);
  angularVelocity += angularAcceleration * dt;
  angularVelocity *= (1 - dampingFactor);
  angle += angularVelocity * dt;
}

function getBobPosition() {
  return {
    x: PIVOT_X + L * Math.sin(angle),
    y: PIVOT_Y + L * Math.cos(angle)
  };
}

function drawBackground() {
  ctx.fillStyle = '#1a1a24';
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = 'rgba(126, 184, 218, 0.04)';
  ctx.lineWidth = 1;
  for (let i = 0; i < W; i += 40) {
    ctx.beginPath();
    ctx.moveTo(i, 0);
    ctx.lineTo(i, H);
    ctx.stroke();
  }
  for (let j = 0; j < H; j += 40) {
    ctx.beginPath();
    ctx.moveTo(0, j);
    ctx.lineTo(W, j);
    ctx.stroke();
  }
}

function drawPivot() {
  ctx.beginPath();
  ctx.arc(PIVOT_X, PIVOT_Y, 6, 0, Math.PI * 2);
  ctx.fillStyle = '#556677';
  ctx.fill();

  ctx.beginPath();
  ctx.arc(PIVOT_X, PIVOT_Y, 3, 0, Math.PI * 2);
  ctx.fillStyle = '#8899aa';
  ctx.fill();
}

function drawTrail(bob) {
  trail.push({ x: bob.x, y: bob.y });
  if (trail.length > MAX_TRAIL) trail.shift();

  for (let i = 1; i < trail.length; i++) {
    const alpha = (i / trail.length) * 0.35;
    const width = (i / trail.length) * 3;
    ctx.beginPath();
    ctx.moveTo(trail[i - 1].x, trail[i - 1].y);
    ctx.lineTo(trail[i].x, trail[i].y);
    ctx.strokeStyle = `rgba(100, 180, 255, ${alpha})`;
    ctx.lineWidth = width;
    ctx.stroke();
  }
}

function drawRod(bob) {
  const gradient = ctx.createLinearGradient(PIVOT_X, PIVOT_Y, bob.x, bob.y);
  gradient.addColorStop(0, 'rgba(120, 140, 160, 0.8)');
  gradient.addColorStop(1, 'rgba(120, 140, 160, 0.4)');

  ctx.beginPath();
  ctx.moveTo(PIVOT_X, PIVOT_Y);
  ctx.lineTo(bob.x, bob.y);
  ctx.strokeStyle = gradient;
  ctx.lineWidth = 2;
  ctx.stroke();
}

function drawBob(bob) {
  const glowLayers = [
    { radius: BOB_RADIUS * 3.5, alpha: 0.03 },
    { radius: BOB_RADIUS * 2.5, alpha: 0.06 },
    { radius: BOB_RADIUS * 1.8, alpha: 0.1 },
    { radius: BOB_RADIUS * 1.3, alpha: 0.15 }
  ];

  for (const layer of glowLayers) {
    const glow = ctx.createRadialGradient(bob.x, bob.y, 0, bob.x, bob.y, layer.radius);
    glow.addColorStop(0, `rgba(100, 180, 255, ${layer.alpha})`);
    glow.addColorStop(1, 'rgba(100, 180, 255, 0)');
    ctx.beginPath();
    ctx.arc(bob.x, bob.y, layer.radius, 0, Math.PI * 2);
    ctx.fillStyle = glow;
    ctx.fill();
  }

  const bobGradient = ctx.createRadialGradient(
    bob.x - BOB_RADIUS * 0.3, bob.y - BOB_RADIUS * 0.3, BOB_RADIUS * 0.1,
    bob.x, bob.y, BOB_RADIUS
  );
  bobGradient.addColorStop(0, '#b8dcf0');
  bobGradient.addColorStop(0.5, '#5ba8d4');
  bobGradient.addColorStop(1, '#2a6a8a');

  ctx.beginPath();
  ctx.arc(bob.x, bob.y, BOB_RADIUS, 0, Math.PI * 2);
  ctx.fillStyle = bobGradient;
  ctx.fill();

  ctx.beginPath();
  ctx.arc(bob.x - BOB_RADIUS * 0.25, bob.y - BOB_RADIUS * 0.25, BOB_RADIUS * 0.35, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
  ctx.fill();
}

function drawAngleArc() {
  const arcRadius = 40;
  const startAngle = Math.PI / 2;
  const endAngle = Math.PI / 2 - angle;

  ctx.beginPath();
  ctx.arc(PIVOT_X, PIVOT_Y, arcRadius, Math.min(startAngle, endAngle), Math.max(startAngle, endAngle));
  ctx.strokeStyle = 'rgba(126, 184, 218, 0.25)';
  ctx.lineWidth = 1;
  ctx.stroke();

  const degrees = ((angle * 180) / Math.PI).toFixed(1);
  const labelX = PIVOT_X + (arcRadius + 14) * Math.sin(angle / 2);
  const labelY = PIVOT_Y + (arcRadius + 14) * Math.cos(angle / 2);
  ctx.font = '12px "Segoe UI", sans-serif';
  ctx.fillStyle = 'rgba(126, 184, 218, 0.5)';
  ctx.fillText(`${degrees}°`, labelX, labelY);
}

function drawEquilibriumLine() {
  ctx.setLineDash([4, 6]);
  ctx.beginPath();
  ctx.moveTo(PIVOT_X, PIVOT_Y);
  ctx.lineTo(PIVOT_X, PIVOT_Y + L + 30);
  ctx.strokeStyle = 'rgba(126, 184, 218, 0.1)';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.setLineDash([]);
}

function animate(timestamp) {
  if (!lastTime) lastTime = timestamp;
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;

  updatePhysics(dt);

  const bob = getBobPosition();

  drawBackground();
  drawEquilibriumLine();
  drawAngleArc();
  drawTrail(bob);
  drawRod(bob);
  drawPivot();
  drawBob(bob);

  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);

const sliderL = document.getElementById('sliderL');
const sliderG = document.getElementById('sliderG');
const sliderD = document.getElementById('sliderD');
const valL = document.getElementById('valL');
const valG = document.getElementById('valG');
const valD = document.getElementById('valD');
const btnReset = document.getElementById('btnReset');

sliderL.addEventListener('input', () => {
  L = parseFloat(sliderL.value);
  valL.textContent = L;
  trail = [];
});

sliderG.addEventListener('input', () => {
  G = parseFloat(sliderG.value);
  valG.textContent = G;
});

sliderD.addEventListener('input', () => {
  dampingFactor = parseFloat(sliderD.value);
  valD.textContent = dampingFactor.toFixed(3);
});

btnReset.addEventListener('click', () => {
  angle = (45 * Math.PI) / 180;
  angularVelocity = 0;
  trail = [];
  lastTime = null;
});

window.addEventListener('resize', () => {
  const newW = Math.min(window.innerWidth * 0.85, 800);
  const newH = Math.min(window.innerHeight * 0.78, 600);
  if (Math.abs(newW - W) > 50 || Math.abs(newH - H) > 50) {
    location.reload();
  }
});
</script>
</body>
</html>
